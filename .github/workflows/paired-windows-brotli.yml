name: Paired Windows Brotli diagnostic

on:
  push:
    branches: [diagnostic/windows-brotli-controls-20260924]
    paths:
      - '.github/workflows/paired-windows-brotli.yml'
      - '.github/scripts/paired-windows-brotli.ps1'

permissions:
  contents: read

jobs:
  paired:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          path: diagnostic
      - uses: actions/checkout@v6
        with:
          repository: VrtxOmega/openssl
          ref: 859aea422b5be17ee9fc0f7678e9de302eb67b72
          persist-credentials: false
          path: source-base
      - uses: actions/checkout@v6
        with:
          repository: VrtxOmega/openssl
          ref: 70be2886587ab3443736a0a0d7f28c9caf735626
          persist-credentials: false
          path: source-candidate
      - name: Build matched sources and run paired controls
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE/diagnostic/.github/scripts/paired-windows-brotli.ps1"'
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-windows-brotli-evidence
          path: evidence
          if-no-files-found: error
          retention-days: 30
